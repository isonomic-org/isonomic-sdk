[package]
name = "isonomic-app"
description = "The trait every first-party Isonomic app implements, and what the window gives it"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Isonomic UI's component library (`ui::component`) and its icon set
# (`ui::assets`). On by default: every app front end is made of them.
default = ["component", "assets"]
component = ["isonomic-ui/component"]
assets = ["isonomic-ui/assets"]
# The extra components (`isonomic_app::extra`): the prompt composer, the
# thinking indicator, approval and tool cards and more.
extra = ["component", "dep:isonomic-ui-extra"]
# The shared toolkits, reached through the SDK; reserved, empty for now.
editor = []
node-graph = []
# A headless host for app tests: an in-memory engine, a granted token,
# GPUI's test harness, and the one-app shell header (so `extra` too).
test-support = ["dep:isonomic-testkit", "isonomic-ui/test-support", "tokio/rt-multi-thread", "extra"]

[dependencies]
isonomic-client.workspace = true
isonomic-proto.workspace = true
isonomic-testkit = { workspace = true, optional = true }
isonomic-ui.workspace = true
isonomic-ui-extra = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
isonomic-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
