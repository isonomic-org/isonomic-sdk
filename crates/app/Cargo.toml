[package]
name = "isonomic-app"
description = "The trait every first-party Isonomic app implements, and what the window gives it"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# A headless host for app tests: an in-memory engine, a granted token, and
# GPUI's test harness.
test-support = ["dep:isonomic-testkit", "isonomic-ui/test-support", "tokio/rt-multi-thread"]

[dependencies]
isonomic-client.workspace = true
isonomic-proto.workspace = true
isonomic-testkit = { workspace = true, optional = true }
isonomic-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
isonomic-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
