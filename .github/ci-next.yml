# The ci.yml this repo needs, waiting to be moved to .github/workflows/ci.yml
# (the connector cannot write workflow files). It needs the shared workflow's
# `ui` input, requested in isonomic-org/.github docs/requests.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: isonomic-org/.github/.github/workflows/rust-ci.yml@main
    secrets: inherit
    with:
      toolchain: "1.97"
      linux-gui-libs: true
      ui: true
      xtask: frozen-fixtures
