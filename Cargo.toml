[workspace]
resolver = "2"
members = ["crates/proto", "crates/client", "crates/testkit"]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
isonomic-proto = { path = "crates/proto", features = ["tokio"] }
isonomic-client = { path = "crates/client" }
isonomic-testkit = { path = "crates/testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
