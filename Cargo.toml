[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/client",
    "crates/testkit",
    "crates/conformance",
    "crates/app",
    "examples/hello-app",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
isonomic-proto = { path = "crates/proto", features = ["tokio"] }
isonomic-client = { path = "crates/client" }
isonomic-testkit = { path = "crates/testkit" }
isonomic-conformance = { path = "crates/conformance" }
# Session event types, re-exported by the proto. Pinned: change only with a
# changelog entry. CI fetches it with the shared workflow's `harness` input.
harness-core = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "9a3809f376e5f7307727f01fad0973b64b8d9e9d" }
# The host the testkit runs agent sessions on, at the same commit.
harness-host = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "9a3809f376e5f7307727f01fad0973b64b8d9e9d" }
isonomic-app = { path = "crates/app" }
# Isonomic UI is a sibling checkout pinned to the commit in UI_REF, the same
# way the engine and the window pin this repo. Only the app crate (and apps)
# depend on it.
isonomic-ui = { path = "../isonomic-ui/crates/ui", default-features = false }
isonomic-ui-extra = { path = "../isonomic-ui/crates/extra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }

# The UI crate's copy of GPUI's macros, which resolve GPUI paths through
# Isonomic UI. The UI workspace applies the same patch.
[patch.crates-io]
gpui-pre-macros = { path = "../isonomic-ui/vendor/gpui-pre-macros" }
